<!DOCTYPE html>
<html>
    <head>
        <title>
            Pesquisa de Satisfação
        </title>
    </head>
    <body>
        <h1>Pesquisa de Satisfação</h1>
        <form>
            <p>
                <label for="nome">Seu Nome:</label>
                <input type="text" placeholder="Seu nome" id="nome" />
            </p>
            <p>
                <label for="email">Seu Email:</label>
                <input type="email" placeholder="Seu email" id="email" />
            </p>
            <p>
                <label for="numero-contato">Seu número de contato:</label>
                <input type="tel" placeholder="Seu número de contato" id="numero-contato" />
            </p>
            <p>
                De 1 a 5 Quanto você gostou do nosso serviço?
                <input type="radio" id="1" name="gostou" />
                <label for="1">1</label>
                <input type="radio" id="2" name="gostou" />
                <label for="2">2</label>
                <input type="radio" id="3" name="gostou" />
                <label for="3">3</label>
                <input type="radio" id="4" name="gostou" />
                <label for="4">4</label>
                <input type="radio" id="5" name="gostou" />
                <label for="5">5</label>
            </p>
            <p>
                De 1 a 3 Qual a probabilidade de recomendar nosso serviço a um amigo?
                <input type="radio" id="1.1" name="recomendar" />
                <label for="1.1">1</label>
                <input type="radio" id="2.1" name="recomendar" />
                <label for="2.1">2</label>
                <input type="radio" id="3.1" name="recomendar" />
                <label for="3.1">3</label>
            </p>
            <p>
                Onde nos encontrou?
                <select>
                    <option>Google</option>
                    <option>YouTube</option>
                    <option>Instagram</option>
                    <option>Twitter</option>
                    <option>Telegram</option>
                    <option>Outros</option>
                </select>
            </p>
            <p>
                <input type="checkbox" id="termos" />
                <label for="termos">Conconrdo em compartilhar minhas respostas com terceiros</label>
            </p>
            <input type="submit" id="enviar" />
        </form>
    </body>
</html>
